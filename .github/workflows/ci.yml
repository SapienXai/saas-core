name: SaaS Core CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:all
      - name: Install packed packages in a generated app
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          registry_file="$temp_dir/registry-url"
          node scripts/local-package-registry.mjs "$GITHUB_WORKSPACE/artifacts" "$registry_file" > "$temp_dir/registry.log" 2>&1 &
          registry_pid=$!
          trap 'kill "$registry_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do if [ -s "$registry_file" ]; then break; fi; if ! kill -0 "$registry_pid" 2>/dev/null; then cat "$temp_dir/registry.log"; exit 1; fi; sleep 1; done
          if [ ! -s "$registry_file" ]; then cat "$temp_dir/registry.log"; exit 1; fi
          SAAS_CORE_TARBALL_DIR="$GITHUB_WORKSPACE/artifacts" node packages/core/dist/cli.js init "$temp_dir/sample-app" --yes --non-interactive
          printf '@sapienx:registry=%s\n' "$(cat "$registry_file")" > "$temp_dir/sample-app/.npmrc"
          pnpm --dir "$temp_dir/sample-app" install --no-frozen-lockfile
          pnpm --dir "$temp_dir/sample-app" typecheck
          pnpm --dir "$temp_dir/sample-app" build

  database-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.65.2 }
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase db reset
      - name: Run authenticated RLS and concurrency tests
        run: |
          eval "$(supabase status -o env)"
          SAAS_CORE_DB_INTEGRATION=1 SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" pnpm test -- tests/database.integration.test.ts

  auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.65.2 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:all
      - run: supabase start
      - run: supabase db reset
      - name: Generate and start the acceptance app
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          temp_dir="$(mktemp -d)"
          echo "SAAS_CORE_ACCEPTANCE_DIR=$temp_dir" >> "$GITHUB_ENV"
          registry_file="$temp_dir/registry-url"
          node scripts/local-package-registry.mjs "$GITHUB_WORKSPACE/artifacts" "$registry_file" > "$temp_dir/registry.log" 2>&1 &
          registry_pid=$!
          trap 'kill "$registry_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do if [ -s "$registry_file" ]; then break; fi; if ! kill -0 "$registry_pid" 2>/dev/null; then cat "$temp_dir/registry.log"; exit 1; fi; sleep 1; done
          if [ ! -s "$registry_file" ]; then cat "$temp_dir/registry.log"; exit 1; fi
          SAAS_CORE_TARBALL_DIR="$GITHUB_WORKSPACE/artifacts" node packages/core/dist/cli.js init "$temp_dir/app" --yes --non-interactive
          printf 'APP_URL=%s\nSAAS_CORE_PRODUCT_NAME=CI Auth Acceptance\nNEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' 'http://127.0.0.1:4321' "$API_URL" "$ANON_KEY" "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" > "$temp_dir/app/.env.local"
          printf '@sapienx:registry=%s\n' "$(cat "$registry_file")" > "$temp_dir/app/.npmrc"
          pnpm --dir "$temp_dir/app" install --no-frozen-lockfile
          pnpm --dir "$temp_dir/app" build
          (pnpm --dir "$temp_dir/app" exec next dev --port 4321 > "$temp_dir/next.log" 2>&1 & echo $! > "$temp_dir/next.pid")
          for attempt in $(seq 1 60); do if curl --fail --silent http://127.0.0.1:4321/ >/dev/null; then break; fi; if [ "$attempt" = 60 ]; then cat "$temp_dir/next.log"; exit 1; fi; sleep 1; done
      - name: Run Chromium auth and protected-route smoke
        run: |
          pnpm --dir "$SAAS_CORE_ACCEPTANCE_DIR/app" exec playwright install --with-deps chromium
          pnpm --dir "$SAAS_CORE_ACCEPTANCE_DIR/app" exec node --input-type=module -e '
            import { chromium } from "playwright";
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto("http://127.0.0.1:4321/signup");
            if (!await page.getByRole("heading", { name: /Create account/i }).isVisible()) throw new Error("signup page did not render");
            await page.goto("http://127.0.0.1:4321/app");
            if (!page.url().includes("/login")) throw new Error(`protected route was not redirected: ${page.url()}`);
            const next = new URL(page.url()).searchParams.get("next");
            if (next !== "/app") throw new Error(`unsafe or missing next redirect: ${next}`);
            await page.getByLabel("Email").fill("invalid@example.test");
            await page.getByLabel("Password").fill("Invalid-password-123!");
            await page.getByRole("button", { name: "Sign in" }).click();
            await page.waitForURL(/error=invalid_credentials/);
            await browser.close();
          '

  cli-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run isolated init, update, conflict, and dry-run fixtures
        run: pnpm test -- tests/cli.integration.test.ts

  generated-app-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.65.2 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:all
      - run: supabase start
      - run: supabase db reset
      - name: Generate and install a packed application
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          temp_dir="$(mktemp -d)"
          echo "SAAS_CORE_ACCEPTANCE_DIR=$temp_dir" >> "$GITHUB_ENV"
          registry_file="$temp_dir/registry-url"
          node scripts/local-package-registry.mjs "$GITHUB_WORKSPACE/artifacts" "$registry_file" > "$temp_dir/registry.log" 2>&1 &
          registry_pid=$!
          trap 'kill "$registry_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do if [ -s "$registry_file" ]; then break; fi; if ! kill -0 "$registry_pid" 2>/dev/null; then cat "$temp_dir/registry.log"; exit 1; fi; sleep 1; done
          if [ ! -s "$registry_file" ]; then cat "$temp_dir/registry.log"; exit 1; fi
          SAAS_CORE_TARBALL_DIR="$GITHUB_WORKSPACE/artifacts" node packages/core/dist/cli.js init "$temp_dir/app" --yes --non-interactive
          cp tests/generated-app.e2e.mjs "$temp_dir/app/generated-app.e2e.mjs"
          printf 'APP_URL=%s\nSAAS_CORE_PRODUCT_NAME=CI Generated Acceptance\nNEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' 'http://127.0.0.1:4321' "$API_URL" "$ANON_KEY" "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" > "$temp_dir/app/.env.local"
          printf '@sapienx:registry=%s\n' "$(cat "$registry_file")" > "$temp_dir/app/.npmrc"
          pnpm --dir "$temp_dir/app" install --no-frozen-lockfile
          pnpm --dir "$temp_dir/app" build
          (pnpm --dir "$temp_dir/app" exec next dev --port 4321 > "$temp_dir/next.log" 2>&1 & echo $! > "$temp_dir/next.pid")
          for attempt in $(seq 1 60); do if curl --fail --silent http://127.0.0.1:4321/ >/dev/null; then break; fi; if [ "$attempt" = 60 ]; then cat "$temp_dir/next.log"; exit 1; fi; sleep 1; done
          pnpm --dir "$temp_dir/app" exec playwright install --with-deps chromium
          SAAS_CORE_APP_URL=http://127.0.0.1:4321 SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" pnpm --dir "$temp_dir/app" exec node generated-app.e2e.mjs

  core-lab-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Execute Core Lab scenarios
        run: |
          node apps/core-lab/server.mjs > /tmp/saas-core-lab.log 2>&1 &
          lab_pid=$!
          trap 'kill "$lab_pid"' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/api/scenarios >/tmp/saas-core-lab.json && break; sleep 1; done
          node --input-type=module -e '
            import fs from "node:fs";
            const payload = JSON.parse(fs.readFileSync("/tmp/saas-core-lab.json", "utf8"));
            if (payload.mode !== "in-memory-deterministic" || payload.scenarios.length !== 9) throw new Error("Core Lab did not return its executable scenario set");
            const allowed = new Set(["PASS", "BLOCKED_AS_EXPECTED", "FAIL", "SKIPPED"]);
            if (payload.scenarios.some((scenario) => !allowed.has(scenario.status) || scenario.status === "FAIL" || !scenario.actual || !scenario.operation)) throw new Error("Core Lab returned a failed or non-executed scenario");
          '

  release-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.65.2 }
      - run: pnpm install --frozen-lockfile
      - name: Run authoritative isolated release verification
        run: pnpm release:verify
