name: SaaS Core quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: saas-core-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_NPM_VERSION: 11.6.2

jobs:
  release-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Pin npm CLI and print release tooling
        run: |
          npm install --global "npm@${RELEASE_NPM_VERSION}"
          node --version
          npm --version
          pnpm --version
          test "$(npm --version)" = "$RELEASE_NPM_VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saas-core-playwright-critical
          path: output/playwright
          if-no-files-found: ignore

  e2e-full:
    needs: release-quality
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: development
      SAAS_CORE_APP_URL: http://127.0.0.1:3100
      SAAS_CORE_MAIL_URL: http://127.0.0.1:55524
      SAAS_CORE_FULL_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:start:ci
      - run: pnpm run db:reset
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run e2e:full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saas-core-playwright-full
          path: output/playwright
          if-no-files-found: ignore
