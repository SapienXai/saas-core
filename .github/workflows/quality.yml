name: SaaS Core quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: saas-core-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: https://ci.invalid.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  SUPABASE_ANON_KEY: ci-placeholder-anon-key
  NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  NEXT_PUBLIC_SITE_URL: https://core.invalid
  NEXT_PUBLIC_APP_URL: https://app.core.invalid
  SAAS_CORE_ROOT_DOMAIN: core.invalid
  SAAS_CORE_APP_DOMAIN: app.core.invalid
  SAAS_CORE_APP_URL: https://app.core.invalid
  SAAS_CORE_RATE_LIMIT_SECRET: ci-only-rate-limit-secret
  SAAS_CORE_API_CREDENTIAL_PEPPER: ci-only-api-credential-pepper
  CRON_SECRET: ci-only-cron-secret
  PADDLE_ENVIRONMENT: sandbox

jobs:
  release-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saas-core-playwright-critical
          path: output/playwright
          if-no-files-found: ignore
